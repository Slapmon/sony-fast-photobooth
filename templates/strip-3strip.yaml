# Classic vertical photo-booth strip — 3 stacked slots in a tall narrow
# canvas. Traditional strip print size, 2x6" at 300dpi -> 600x1800px. See
# photobooth-plan.md §7/§8 and IMPLEMENTATION_PLAN.md §8 (T-2.5).
name: "Classic 3-Strip"
canvas:
  width_mm: 50.8
  height_mm: 152.4
  dpi: 300
  background: "#ffffff"
slots:
  - { x: 30, y: 30,   w: 540, h: 560, fit: cover }
  - { x: 30, y: 620,  w: 540, h: 560, fit: cover }
  - { x: 30, y: 1210, w: 540, h: 560, fit: cover }
overlays:
  - { type: image, src: "assets/frame.png", x: 0, y: 0, w: 600, h: 1800 }
  - type: text
    content: "{event.title} · {event.date}"
    # PLACEHOLDER — not a real font file, just satisfies load-time existence
    # validation (T-2.1); compositor falls back to a system font with a
    # logged warning. Drop a real script font in here before real use.
    font: "assets/PLACEHOLDER_FONT.ttf"
    size: 28
    color: "#3a3a3a"
    anchor: bottom-center
    y_offset: -12
variants:
  print: { dpi: 300, format: jpeg, quality: 95 }
  web:   { long_edge: 2000, format: jpeg, quality: 85 }
  thumb: { long_edge: 400,  format: jpeg, quality: 75 }
