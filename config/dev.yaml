# Dev profile: runs entirely on a laptop, no hardware required.
# Same shape as config/pi.yaml — only the backend selections differ.
# See IMPLEMENTATION_PLAN.md §3.

profile: dev

camera:
  backend: mock
  worker_port: 8765
  mock:
    fixtures_dir: fixtures/shots
    trigger_delay_ms: 250
    thumb_latency_ms: 150
    full_download_mbps: 40.0
    # Fault injection (IMPLEMENTATION_PLAN.md §4.4) — off by default. Set
    # disconnect_every_n to simulate the Sony PTP-session-drop risk, or the
    # *_pct knobs to simulate flaky USB transfers, for local testing.
    disconnect_every_n: null
    download_timeout_pct: 0.0
    slow_download_pct: 0.0

preview:
  # Point go2rtc at a laptop webcam, or loop a video file:
  #   exec:ffmpeg -stream_loop -1 -i fixtures/preview.mp4 -f mjpeg -c:v copy -
  stream_url: "http://127.0.0.1:1984/api/stream.mjpeg?src=photobooth"

printing:
  backend: null
  null_backend:
    output_dir: out/prints
    simulated_job_seconds: 13

delivery:
  backend: local
  local:
    output_dir: out/uploads

storage:
  sqlite_path: out/photobooth.db

web:
  host: 127.0.0.1
  port: 8000

events:
  base_dir: events
  # example-event is a real, loadable event checked into the repo (T-2.7) —
  # gives the dev profile something to point at besides the "dev" placeholder.
  active_event_id: example-event

kiosk:
  # Shorter than the 60s default for local testing (T-3.3), so the
  # attract-loop return doesn't take a full minute to observe.
  idle_timeout_s: 20.0

admin:
  # Real PIN for local dev only — never used on the pi profile (see pi.yaml,
  # T-3.7). secret_key intentionally left unset: it's generated randomly at
  # startup, so restarting `just dev` invalidates any open admin session,
  # which is fine for local work.
  pin: "0000"

logging:
  level: INFO
  # Bump the camera package to DEBUG when chasing a capture/reconnect bug
  # locally (mirrors the module_levels example in config/models.py's
  # LoggingConfig docstring) — left empty by default.
  module_levels: {}
