# Pi profile: real hardware backends. Requires the `pi` extra
# (python-gphoto2, pyvips, pycups) and system libraries (libgphoto2, libvips,
# CUPS) to be present. See IMPLEMENTATION_PLAN.md §3 and §6 for the Phase 0
# settings that must be locked down on the camera before this is trustworthy.

profile: pi

camera:
  backend: gphoto
  worker_port: 8765
  gphoto:
    # L: Phase 0 (IMPLEMENTATION_PLAN.md §6 T-C5) found no measurable latency
    # cost vs S/M on the a6400 (44-48ms download regardless of size) — L
    # gives the best print/archive quality for free.
    jpeg_size: L

preview:
  stream_url: "http://127.0.0.1:1984/api/stream.mjpeg?src=photobooth"

printing:
  backend: cups
  cups:
    printer_name: ""   # fill in after `lpstat -p`
    print_limit_per_session: 2

delivery:
  backend: sftp
  sftp:
    host: ""
    remote_path: ""
  # Once SFTP delivers to a real, internet-reachable server, set this to
  # that server's public URL — the review screen's QR code then sends
  # guests straight there over their own mobile data instead of requiring
  # them to join the booth's Wi-Fi. Leave blank to keep using the booth's
  # own LAN address (fine for testing, requires guest Wi-Fi for real use).
  public_base_url: ""

storage:
  sqlite_path: /var/lib/photobooth/photobooth.db

web:
  host: 0.0.0.0
  port: 8000

events:
  base_dir: /var/lib/photobooth/events
  # Venue operator fills this in per booking (must match a directory under
  # base_dir containing an event.yaml) — no real default makes sense here.
  active_event_id: ""

kiosk:
  # Return to the attract loop after 60s of no guest interaction (T-3.3).
  idle_timeout_s: 60.0

# REQUIRED before going live: uncomment `admin:` below and set a real PIN.
# Left as-is (no `admin` section at all), `admin.pin` falls back to
# Settings' obviously-fake default ("changeme") and the app logs a loud
# "admin_pin_is_default" warning at startup (config/models.py's
# Settings.load) — it still starts, this is a single-booth kiosk not worth
# hard-failing boot over, but do not run a real event with the default PIN
# still active.
# admin:
#   pin: "CHANGE-ME-BEFORE-THE-EVENT"
#   # Optional: set to a fixed random-looking string to make admin sessions
#   # survive an app restart (see config/models.py's AdminConfig docstring
#   # for why the default is to generate one fresh each boot instead).
#   # secret_key: ""

logging:
  # journald (via deploy/systemd/photobooth.service) captures and rotates
  # stdout/stderr — see deploy/systemd/README.md. INFO is the right default
  # for an event; bump camera.* to DEBUG here (uncomment/edit) if diagnosing
  # a reconnect issue during a rental, without drowning everything else.
  level: INFO
  module_levels: {}
  # module_levels:
  #   photobooth.camera: DEBUG
