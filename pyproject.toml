[project]
name = "photobooth"
version = "0.1.0"
description = "Rentable event photobooth: fast tethered capture, live preview, templated compositing, printing and delivery."
requires-python = ">=3.11"
readme = "README.md"

# Core dependencies — needed on every profile (dev laptop and Pi).
# pyvips lives here (not under the `pi` extra) even though its stack-table
# entry is next to the hardware backends: the render pipeline (T-2.2+) needs
# to run in dev too, for local testing against templates without a Pi. It
# pulls in `pyvips-binary` transitively on platforms that need a bundled
# libvips (e.g. Windows dev laptops without a system libvips install); on
# Linux/Pi a system libvips satisfies it directly.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "msgspec>=0.18",
    "structlog>=24.4",
    "PyYAML>=6.0",
    "qrcode[pil]>=8.0",
    "Pillow>=10.4",
    "httpx>=0.27",
    "pyvips>=2.2",
]

[project.optional-dependencies]
# Hardware backends — only installable/usable on the Pi (or a Linux box with
# libgphoto2/CUPS system libraries present). Kept optional so `just dev`
# works on a plain Windows/macOS laptop against the mock backends.
pi = [
    "gphoto2>=2.5",
    "pycups>=2.0.4",
]
# Delivery backends with heavier/optional deps.
delivery = [
    "paramiko>=3.5",     # SFTP
    "boto3>=1.35",        # S3 / R2 / B2
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "playwright>=1.48",
    # Bundled libvips binary — dev Windows laptops have no system libvips,
    # unlike the Pi/Linux boxes pyvips otherwise expects one on. Harmless
    # extra weight on platforms that already have a system libvips.
    "pyvips-binary>=8.14; sys_platform == 'win32'",
]

[project.scripts]
photobooth = "photobooth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photobooth"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/photobooth/core", "src/photobooth/camera"]

[[tool.mypy.overrides]]
module = "gphoto2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qrcode"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "hardware: requires real camera/printer/capture-stick hardware (skipped by default)",
]
addopts = "-m 'not hardware'"
